<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, minimum-scale=0.1, maximum-scale=4, user-scalable=yes" />
  <title>KrisNote</title>

  <meta name="theme-color" content="#f2f0e9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="KrisNote" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="KrisNote – eine Notizen-App als Progressive Web App, angelehnt an Apple Notes." />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app">

    <!-- Spalte 1: Ordner / Kategorien -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1 class="sidebar-title">KrisNote</h1>
        <button class="sidebar-add-btn" id="newFolderBtn" type="button" aria-label="Neuer Ordner" title="Neuer Ordner">
          <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M9.2 2.5h1.6v6.7h6.7v1.6h-6.7v6.7H9.2v-6.7H2.5V9.2h6.7z"/></svg>
        </button>
      </div>

      <nav class="folder-list" id="folderList">
        <!-- "Alle Notizen" und Ordner werden hier per JS eingefügt -->
      </nav>
    </aside>

    <div class="sidebar-resizer" id="sidebarResizer"></div>

    <!-- Spalte 2: Notizliste -->
    <section class="note-list-pane" id="noteListPane">
      <div class="note-list-header">
        <div class="search-field">
          <svg viewBox="0 0 20 20" class="icon icon-search" aria-hidden="true"><path fill-rule="evenodd" d="M13.6 12.3a6 6 0 1 1 1.3-1.3l3.9 3.9-1.3 1.3-3.9-3.9zM14 8a6 6 0 1 0-12 0 6 6 0 0 0 12 0z" clip-rule="evenodd"/></svg>
          <input type="search" id="searchInput" placeholder="Suchen" autocomplete="off" />
        </div>
      </div>

      <div class="note-count-row">
        <p class="note-count" id="noteCount"></p>
        <button class="sidebar-add-btn" id="newNoteBtn" type="button" aria-label="Neue Notiz" title="Neue Notiz">
          <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M9.2 2.5h1.6v6.7h6.7v1.6h-6.7v6.7H9.2v-6.7H2.5V9.2h6.7z"/></svg>
        </button>
      </div>

      <div class="note-list" id="noteList">
        <!-- Notiz-Einträge werden hier per JS eingefügt -->
      </div>
    </section>

    <div class="sidebar-resizer" id="listResizer"></div>

    <!-- Spalte 3: Editor -->
    <main class="editor-pane" id="editorPane">
      <div class="editor-empty" id="editorEmpty">
        <svg viewBox="0 0 64 64" class="empty-icon" aria-hidden="true">
          <rect x="10" y="6" width="44" height="54" rx="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <line x1="18" y1="20" x2="46" y2="20" stroke="currentColor" stroke-width="2.5"/>
          <line x1="18" y1="30" x2="46" y2="30" stroke="currentColor" stroke-width="2.5"/>
          <line x1="18" y1="40" x2="38" y2="40" stroke="currentColor" stroke-width="2.5"/>
        </svg>
        <p>Keine Notiz ausgewählt</p>
      </div>

      <article class="editor" id="editor" hidden>
        <div class="editor-toolbar ribbon">
          <div class="ribbon-group" id="formatGroup">
            <button class="toolbar-btn" id="headingBtn" type="button" disabled aria-label="Formatvorlage (Überschrift)" title="Formatvorlage (Überschrift)">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><text x="1.5" y="15" font-size="13" font-weight="800" fill="currentColor">H</text></svg>
            </button>
            <button class="toolbar-btn toolbar-select-btn" id="ribbonFontFamilyBtn" type="button" disabled aria-label="Schriftart" title="Schriftart">
              <span class="select-label" id="ribbonFontFamilyLabel">Standard</span>
              <svg viewBox="0 0 10 6" class="select-chevron" aria-hidden="true"><path d="M0 1l5 4 5-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="toolbar-btn toolbar-select-btn" id="ribbonFontSizeBtn" type="button" disabled aria-label="Schriftgröße" title="Schriftgröße">
              <span class="select-label" id="ribbonFontSizeLabel">Standard</span>
              <svg viewBox="0 0 10 6" class="select-chevron" aria-hidden="true"><path d="M0 1l5 4 5-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="toolbar-btn" id="boldBtn" type="button" disabled aria-label="Fett" title="Fett">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><text x="4" y="15.5" font-size="14" font-weight="800" fill="currentColor">B</text></svg>
            </button>
            <button class="toolbar-btn" id="italicBtn" type="button" disabled aria-label="Kursiv" title="Kursiv">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><text x="5.5" y="15.5" font-size="14" font-style="italic" font-weight="600" fill="currentColor">I</text></svg>
            </button>
            <button class="toolbar-btn" id="underlineBtn" type="button" disabled aria-label="Unterstrichen" title="Unterstrichen">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><text x="4.5" y="13.5" font-size="13" font-weight="700" fill="currentColor">U</text><rect x="3" y="15.6" width="12" height="1.6" rx="0.8"/></svg>
            </button>
            <button class="toolbar-btn" id="strikeBtn" type="button" disabled aria-label="Durchgestrichen" title="Durchgestrichen">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><text x="4.5" y="15" font-size="13" font-weight="700" fill="currentColor">S</text><rect x="2.5" y="9.2" width="13" height="1.6" rx="0.8"/></svg>
            </button>
            <button class="toolbar-btn" id="superscriptBtn" type="button" disabled aria-label="Hochgestellt" title="Hochgestellt">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><text x="2" y="16" font-size="13" font-weight="700" fill="currentColor">x</text><text x="10.5" y="9" font-size="8" font-weight="700" fill="currentColor">2</text></svg>
            </button>
            <button class="toolbar-btn" id="subscriptBtn" type="button" disabled aria-label="Tiefgestellt" title="Tiefgestellt">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><text x="2" y="12" font-size="13" font-weight="700" fill="currentColor">x</text><text x="10.5" y="17" font-size="8" font-weight="700" fill="currentColor">2</text></svg>
            </button>
            <button class="toolbar-btn" id="ribbonColorBtn" type="button" disabled aria-label="Textfarbe" title="Textfarbe">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><text x="2.5" y="14.5" font-size="13" font-weight="700" fill="currentColor">A</text><rect x="2" y="16.6" width="14" height="2.2" rx="1" fill="#e0402c"/></svg>
            </button>
            <button class="toolbar-btn" id="ribbonMarkerBtn" type="button" disabled aria-label="Markieren" title="Markieren">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M4.4 12.6 11 3.3c.5-.7 1.5-.8 2.2-.3l2.1 1.5c.7.5.8 1.5.3 2.2l-6.6 9.3-5.2.9.6-4.3z" fill="currentColor"/><rect x="2" y="17.4" width="16" height="1.8" rx="0.9" fill="#ffd400"/></svg>
            </button>
          </div>

          <div class="ribbon-divider"></div>

          <div class="ribbon-group" id="listGroup">
            <button class="toolbar-btn" id="bulletListBtn" type="button" disabled aria-label="Aufzählungszeichen" title="Aufzählungszeichen">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><circle cx="3.5" cy="5" r="1.4"/><circle cx="3.5" cy="10" r="1.4"/><circle cx="3.5" cy="15" r="1.4"/><rect x="7" y="4.2" width="10" height="1.6" rx="0.8"/><rect x="7" y="9.2" width="10" height="1.6" rx="0.8"/><rect x="7" y="14.2" width="10" height="1.6" rx="0.8"/></svg>
            </button>
            <button class="toolbar-btn" id="numberedListBtn" type="button" disabled aria-label="Nummerierung" title="Nummerierung">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><text x="0.5" y="6.5" font-size="6" font-weight="700" fill="currentColor">1</text><text x="0.5" y="11.5" font-size="6" font-weight="700" fill="currentColor">2</text><text x="0.5" y="16.5" font-size="6" font-weight="700" fill="currentColor">3</text><rect x="7" y="4.2" width="10" height="1.6" rx="0.8"/><rect x="7" y="9.2" width="10" height="1.6" rx="0.8"/><rect x="7" y="14.2" width="10" height="1.6" rx="0.8"/></svg>
            </button>
          </div>

          <div class="ribbon-divider"></div>

          <div class="ribbon-group">
            <button class="toolbar-btn" id="addTextBtn" type="button" aria-label="Text hinzufügen" title="Text hinzufügen">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M3 3h14v2.2h-6v11.8H9V5.2H3V3z"/></svg>
            </button>
            <button class="toolbar-btn" id="drawModeBtn" type="button" aria-label="Zeichnen" title="Zeichnen (Stift-Modus)">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M13.6 2.4a1.9 1.9 0 0 1 2.7 2.7L7.4 14 4 15l1-3.4 8.6-9.2zM3 17.5h14V19H3v-1.5z"/></svg>
            </button>
            <button class="toolbar-btn" id="addImageBtn" type="button" aria-label="Bild hinzufügen" title="Bild hinzufügen">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M3 4h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 10h12l-3.8-5-2.7 3.5L7.5 10 4 14zm2-6a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>
            </button>
            <input type="file" id="imageFileInput" accept="image/*" hidden />
            <button class="toolbar-btn" id="addPdfBtn" type="button" aria-label="PDF hinzufügen" title="PDF hinzufügen">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M5 2h7l3 3v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm6.5.6V6H15L11.5 2.6zM6.2 9.5h1.6c.9 0 1.5.5 1.5 1.4 0 .9-.6 1.4-1.5 1.4h-.7v1.6H6.2V9.5zm1 .9v1h.5c.3 0 .5-.2.5-.5s-.2-.5-.5-.5h-.5zm2.7-.9h1.4c1.2 0 1.9.7 1.9 2.2 0 1.5-.7 2.2-1.9 2.2H9.9V9.5zm1 .9v2.6h.3c.6 0 1-.4 1-1.3s-.4-1.3-1-1.3h-.3zm3-.9h2.3v.9h-1.3v.7h1.2v.9h-1.2v1.6h-1V9.5z"/></svg>
            </button>
            <input type="file" id="pdfFileInput" accept="application/pdf" hidden />
          </div>

          <div class="ribbon-divider"></div>

          <div class="ribbon-group">
            <button class="toolbar-btn" id="backgroundBtn" type="button" aria-label="Hintergrund" title="Hintergrund der Fläche">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M4 3h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm1.2 3.2h.1m3.5 0h.1m3.5 0h.1M5.2 9.7h.1m3.5 0h.1m3.5 0h.1M5.2 13.2h.1m3.5 0h.1m3.5 0h.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
            </button>
            <button class="toolbar-btn" id="moveNoteBtn" type="button" aria-label="Notiz verschieben" title="In Ordner verschieben">
              <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M2 5.5C2 4.67 2.67 4 3.5 4h4.13c.36 0 .7.14.96.4l1.2 1.2c.26.26.6.4.96.4H16.5c.83 0 1.5.67 1.5 1.5v7.6c0 .83-.67 1.5-1.5 1.5h-13C2.67 16.6 2 15.93 2 15.1V5.5z"/></svg>
            </button>
          </div>
        </div>

        <div class="editor-body">
          <textarea id="titleInput" class="title-input" placeholder="Titel" rows="1"></textarea>

          <div class="canvas-workspace" id="canvasWorkspace">
            <div class="draw-toolbar" id="drawToolbar" hidden>
              <div class="draw-tools-switch">
                <button type="button" class="draw-tool-btn active" id="drawPenToolBtn" aria-label="Stift" title="Stift">
                  <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M13.6 2.4a1.9 1.9 0 0 1 2.7 2.7L7.4 14 4 15l1-3.4 8.6-9.2zM3 17.5h14V19H3v-1.5z"/></svg>
                </button>
                <button type="button" class="draw-tool-btn" id="drawSelectToolBtn" aria-label="Auswählen (Lasso)" title="Auswählen (Lasso)">
                  <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.5 2"/><circle cx="10" cy="10" r="1.4" fill="currentColor"/></svg>
                </button>
              </div>
              <div class="draw-colors" id="drawColors">
                <button type="button" class="draw-color active" data-color="#1c1c1e" style="--swatch:#1c1c1e" aria-label="Schwarz"></button>
                <button type="button" class="draw-color" data-color="#ff3b30" style="--swatch:#ff3b30" aria-label="Rot"></button>
                <button type="button" class="draw-color" data-color="#007aff" style="--swatch:#007aff" aria-label="Blau"></button>
                <button type="button" class="draw-color" data-color="#34c759" style="--swatch:#34c759" aria-label="Grün"></button>
                <button type="button" class="draw-color" data-color="#ff9500" style="--swatch:#ff9500" aria-label="Orange"></button>
              </div>
              <div class="draw-actions">
                <button type="button" class="draw-tool-btn" id="drawEraserBtn" aria-label="Radiergummi" title="Radiergummi">
                  <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M13.5 2.6a2 2 0 0 1 2.9 0l1 1a2 2 0 0 1 0 2.9L9.8 14H5.4L3 11.6l8.6-8.6c.6-.6 1.3-.9 1.9-.4zM4.6 12.6 7.4 15.4H3.5A1.5 1.5 0 0 1 2 13.9v-.3l2.6-1z"/></svg>
                </button>
                <button type="button" class="draw-tool-btn" id="drawUndoBtn" aria-label="Rückgängig" title="Rückgängig">
                  <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M7 4 3 8l4 4V9c3.9 0 6.5 1.3 8 4-0.3-4.7-3-8-8-8V4z"/></svg>
                </button>
                <button type="button" class="draw-tool-btn" id="drawClearBtn" aria-label="Alles löschen" title="Alles löschen">
                  <svg viewBox="0 0 20 20" class="icon" aria-hidden="true"><path d="M6 2.5h8l.5 1.5H16v1.5H4V4h1.5L6 2.5zM5 7h10l-.7 10.1c-.05.7-.63 1.4-1.5 1.4H7.2c-.87 0-1.45-.7-1.5-1.4L5 7z"/></svg>
                </button>
                <button type="button" class="sketch-done-btn" id="drawDoneBtn">Fertig</button>
              </div>
            </div>

            <div class="canvas-surface" id="canvasSurface">
              <canvas id="inkLayer" class="ink-layer"></canvas>
            </div>
          </div>
        </div>
      </article>
    </main>
  </div>

  <!-- Ordner-Auswahl / Verschieben-Menü -->
  <div class="popover-backdrop" id="popoverBackdrop" hidden>
    <div class="popover" id="movePopover">
      <p class="popover-title">In Ordner verschieben</p>
      <div class="popover-list" id="movePopoverList"></div>
    </div>
  </div>

  <!-- Hintergrund-Auswahl -->
  <div class="popover-backdrop" id="backgroundPopoverBackdrop" hidden>
    <div class="popover" id="backgroundPopover">
      <p class="popover-title">Hintergrund</p>
      <div class="popover-list">
        <div class="popover-item" data-bg="dots">Punkte</div>
        <div class="popover-item" data-bg="lines">Linien</div>
        <div class="popover-item" data-bg="blank">Leer (Whiteboard)</div>
      </div>
    </div>
  </div>

  <!-- Textart-Auswahl -->
  <div class="popover-backdrop" id="textStylePopoverBackdrop" hidden>
    <div class="popover popover-wide" id="textStylePopover">
      <p class="popover-title">Textart</p>
      <div class="popover-list">
        <button type="button" class="popover-item popover-item-rich" data-style="boxed">
          <span class="popover-item-title">Textfeld</span>
          <span class="popover-item-desc">Text in einem abgegrenzten, hinterlegten Feld – gut lesbar, unabhängig vom Hintergrund.</span>
        </button>
        <button type="button" class="popover-item popover-item-rich" data-style="free">
          <span class="popover-item-title">Freier Text</span>
          <span class="popover-item-desc">Text ohne sichtbaren Rahmen, liegt direkt auf der Fläche – ideal zum Beschriften auf linierten Seiten.</span>
        </button>
      </div>
    </div>
  </div>

  <!-- PDF-Einfügeart -->
  <div class="popover-backdrop" id="pdfModePopoverBackdrop" hidden>
    <div class="popover popover-wide" id="pdfModePopover">
      <p class="popover-title">PDF einfügen</p>
      <div class="popover-list">
        <button type="button" class="popover-item popover-item-rich" data-mode="pages">
          <span class="popover-item-title">Alle Seiten anzeigen</span>
          <span class="popover-item-desc">Die ganze PDF wird optisch auf die Fläche gedruckt (alle Seiten untereinander) – du kannst direkt darauf zeichnen oder Text platzieren.</span>
        </button>
        <button type="button" class="popover-item popover-item-rich" data-mode="file">
          <span class="popover-item-title">Nur Datei ablegen</span>
          <span class="popover-item-desc">Kompakte Ablage als Datei-Symbol, ohne die Seiten anzuzeigen.</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Ordnerfarbe -->
  <div class="popover-backdrop" id="folderColorPopoverBackdrop" hidden>
    <div class="popover" id="folderColorPopover">
      <p class="popover-title">Ordnerfarbe</p>
      <div class="format-grid" id="folderColorGrid"></div>
    </div>
  </div>

  <!-- Textmarker (Farbe/Stärke) -->
  <div class="popover-backdrop" id="markerPopoverBackdrop" hidden>
    <div class="popover popover-wide" id="markerPopover">
      <p class="popover-title">Markieren</p>
      <div class="format-grid" id="markerGrid"></div>
      <div class="popover-list">
        <button type="button" class="popover-item" id="markerRemoveBtn">Markierung entfernen</button>
      </div>
    </div>
  </div>

  <!-- Textfarbe -->
  <div class="popover-backdrop" id="colorPopoverBackdrop" hidden>
    <div class="popover popover-wide" id="colorPopover">
      <p class="popover-title">Textfarbe</p>
      <div class="format-grid" id="colorGrid"></div>
      <div class="popover-list">
        <button type="button" class="popover-item" id="colorResetBtn">Standardfarbe</button>
      </div>
    </div>
  </div>

  <!-- Schriftgröße -->
  <div class="popover-backdrop" id="fontSizePopoverBackdrop" hidden>
    <div class="popover" id="fontSizePopover">
      <p class="popover-title">Schriftgröße</p>
      <div class="popover-list" id="fontSizeList"></div>
    </div>
  </div>

  <!-- Formatvorlage (Überschrift) -->
  <div class="popover-backdrop" id="headingPopoverBackdrop" hidden>
    <div class="popover" id="headingPopover">
      <p class="popover-title">Formatvorlage</p>
      <div class="popover-list" id="headingList"></div>
    </div>
  </div>

  <!-- Schriftart -->
  <div class="popover-backdrop" id="fontFamilyPopoverBackdrop" hidden>
    <div class="popover" id="fontFamilyPopover">
      <p class="popover-title">Schriftart</p>
      <div class="popover-list" id="fontFamilyList"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.warn('Service Worker Registrierung fehlgeschlagen:', err);
        });
      });
    }
  </script>
</body>
</html>
