<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bogenschießen – Punktezähler</title>
<style>
  :root {
    --bg: #f2f0e9;
    --panel: #ffffff;
    --border: #ddd8cc;
    --ink: #2b2a26;
    --muted: #7a766a;
    --accent: #2f7d5a;
    --accent-light: #e4f2ec;
    --hit1: #2f7d5a;
    --hit2: #c98a2c;
    --miss: #b5473b;
    --danger: #b5473b;
    --gold: #c9962c;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    padding-bottom: 110px;
    max-width: 720px;
    margin: 0 auto;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }

  h1 {
    font-size: 1.15rem;
    margin: 0 0 10px;
    text-align: center;
  }

  .players {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  @media (min-width: 520px) {
    .players { grid-template-columns: repeat(4, 1fr); }
  }

  .player-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    text-align: center;
  }

  .player-card input {
    width: 100%;
    border: none;
    background: transparent;
    text-align: center;
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--ink);
    padding: 2px;
    border-bottom: 1px solid transparent;
  }

  .player-card input:focus {
    outline: none;
    border-bottom: 1px solid var(--accent);
  }

  .player-card .total {
    margin-top: 4px;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent);
  }

  .round-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    gap: 8px;
  }

  .round-meta .round-label {
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
  }

  .round-meta .round-label.editing {
    color: var(--hit2);
  }

  .icon-btn {
    border: none;
    background: none;
    font-size: 1.15rem;
    padding: 4px 8px;
    cursor: pointer;
    border-radius: 8px;
    color: var(--ink);
    white-space: nowrap;
  }

  .icon-btn:active { background: var(--accent-light); }

  main {
    padding: 16px;
  }

  .round {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
  }

  .round-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    flex-wrap: wrap;
  }

  .round-row + .round-row {
    border-top: 1px solid #f0eee6;
  }

  .round-row .name {
    flex: 0 0 84px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .btn-group {
    display: flex;
    gap: 6px;
    flex: 1;
    min-width: 220px;
  }

  .score-btn {
    flex: 1;
    min-height: 46px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--panel);
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    padding: 4px 2px;
    line-height: 1.2;
  }

  .score-btn.hit1.selected {
    background: var(--hit1);
    border-color: var(--hit1);
    color: #fff;
  }

  .score-btn.hit2.selected {
    background: var(--hit2);
    border-color: var(--hit2);
    color: #fff;
  }

  .score-btn.miss.selected {
    background: var(--miss);
    border-color: var(--miss);
    color: #fff;
  }

  .actions {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 75%, transparent);
    display: flex;
    gap: 6px;
    max-width: 720px;
    margin: 0 auto;
    box-sizing: border-box;
  }

  .btn {
    border: none;
    border-radius: 12px;
    padding: 12px 4px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    flex: 1 1 0;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-secondary {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--border);
  }

  .btn-secondary:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .btn-finish {
    background: var(--panel);
    color: var(--danger);
    border: 1px solid var(--border);
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }

  .modal-overlay[hidden] { display: none; }

  .modal {
    background: var(--panel);
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 720px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .modal-header h2 {
    margin: 0;
    font-size: 1.1rem;
  }

  .history-empty {
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
    padding: 20px 0;
  }

  .history-entry {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }

  .history-entry-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .history-date {
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
  }

  .history-delete {
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 1rem;
  }

  .history-scores {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .history-score-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
  }

  .history-score-row .name {
    font-weight: 600;
  }

  .history-score-row.winner .name::before {
    content: "🏆 ";
  }
</style>
</head>
<body>

  <div class="topbar">
    <h1>🏹 Bogenschießen – Punktezähler</h1>
    <div class="players" id="players"></div>
    <div class="round-meta">
      <span class="round-label" id="roundLabel"></span>
      <button class="icon-btn" id="historyBtn" type="button" aria-label="Historie" title="Historie">📜 Historie</button>
    </div>
  </div>

  <main>
    <div class="round" id="round"></div>
  </main>

  <div class="actions">
    <button class="btn btn-secondary" id="prevRound">← Zurück</button>
    <button class="btn btn-primary" id="nextRound">Weiter →</button>
    <button class="btn btn-finish" id="finishGame">Beenden</button>
  </div>

  <div class="modal-overlay" id="historyOverlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>Historie</h2>
        <button class="icon-btn" id="closeHistory" type="button" aria-label="Schließen">✕</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'bogenschiessen-state-v3';
  const POINTS = { hit1: 20, hit2: 10, miss: 0 };
  const LABELS = { hit1: '1. Pfeil (20)', hit2: '2. Pfeil (10)', miss: 'Kein Treffer (0)' };

  function shuffledOrder() {
    const order = [0, 1, 2, 3];
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    return order;
  }

  function newRound() {
    return { scores: [null, null, null, null], order: shuffledOrder() };
  }

  function defaultState() {
    return {
      players: ['Spieler 1', 'Spieler 2', 'Spieler 3', 'Spieler 4'],
      rounds: [newRound()],
      viewIndex: 0,
      history: [],
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      if (
        !Array.isArray(parsed.players) || parsed.players.length !== 4 ||
        !Array.isArray(parsed.rounds) || parsed.rounds.length === 0 ||
        typeof parsed.viewIndex !== 'number' ||
        !Array.isArray(parsed.history)
      ) {
        return defaultState();
      }
      return parsed;
    } catch (e) {
      return defaultState();
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      // Speichern fehlgeschlagen (z.B. privater Modus) – Spiel läuft trotzdem weiter im Speicher
    }
  }

  let state = loadState();

  const playersEl = document.getElementById('players');
  const roundEl = document.getElementById('round');
  const roundLabel = document.getElementById('roundLabel');
  const prevBtn = document.getElementById('prevRound');
  const historyOverlay = document.getElementById('historyOverlay');
  const historyList = document.getElementById('historyList');

  function totals() {
    const sums = [0, 0, 0, 0];
    state.rounds.forEach((round) => {
      round.scores.forEach((outcome, i) => {
        if (outcome) sums[i] += POINTS[outcome];
      });
    });
    return sums;
  }

  function currentRound() {
    return state.rounds[state.viewIndex];
  }

  function renderPlayers() {
    const sums = totals();
    const round = currentRound();
    playersEl.innerHTML = '';
    round.order.forEach((i) => {
      const card = document.createElement('div');
      card.className = 'player-card';
      const input = document.createElement('input');
      input.value = state.players[i];
      input.maxLength = 20;
      input.addEventListener('input', () => {
        state.players[i] = input.value;
        saveState();
      });
      const total = document.createElement('div');
      total.className = 'total';
      total.textContent = sums[i];
      card.appendChild(input);
      card.appendChild(total);
      playersEl.appendChild(card);
    });

    const isPast = state.viewIndex < state.rounds.length - 1;
    roundLabel.textContent = `Runde ${state.viewIndex + 1} von ${state.rounds.length}` + (isPast ? ' (bearbeiten)' : '');
    roundLabel.classList.toggle('editing', isPast);
    prevBtn.disabled = state.viewIndex === 0;
  }

  function renderRound() {
    roundEl.innerHTML = '';
    const round = currentRound();
    round.order.forEach((i) => {
      const row = document.createElement('div');
      row.className = 'round-row';

      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = state.players[i];
      row.appendChild(nameEl);

      const group = document.createElement('div');
      group.className = 'btn-group';

      ['hit1', 'hit2', 'miss'].forEach((key) => {
        const btn = document.createElement('button');
        btn.className = `score-btn ${key}`;
        btn.textContent = LABELS[key];
        if (round.scores[i] === key) btn.classList.add('selected');
        btn.addEventListener('click', () => {
          round.scores[i] = round.scores[i] === key ? null : key;
          saveState();
          render();
        });
        group.appendChild(btn);
      });

      row.appendChild(group);
      roundEl.appendChild(row);
    });
  }

  function render() {
    renderPlayers();
    renderRound();
  }

  document.getElementById('prevRound').addEventListener('click', () => {
    if (state.viewIndex === 0) return;
    state.viewIndex -= 1;
    saveState();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.getElementById('nextRound').addEventListener('click', () => {
    if (state.viewIndex < state.rounds.length - 1) {
      state.viewIndex += 1;
    } else {
      state.rounds.push(newRound());
      state.viewIndex = state.rounds.length - 1;
    }
    saveState();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.getElementById('finishGame').addEventListener('click', () => {
    if (!confirm('Spiel beenden und Endstand in der Historie speichern?')) return;
    const sums = totals();
    state.history.unshift({
      date: new Date().toISOString(),
      players: state.players.map((name, i) => ({ name, total: sums[i] })),
    });
    state.rounds = [newRound()];
    state.viewIndex = 0;
    saveState();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  function renderHistory() {
    historyList.innerHTML = '';
    if (state.history.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'history-empty';
      empty.textContent = 'Noch keine gespeicherten Spiele.';
      historyList.appendChild(empty);
      return;
    }

    state.history.forEach((entry, hi) => {
      const card = document.createElement('div');
      card.className = 'history-entry';

      const header = document.createElement('div');
      header.className = 'history-entry-header';
      const date = document.createElement('span');
      date.className = 'history-date';
      const d = new Date(entry.date);
      date.textContent = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const del = document.createElement('button');
      del.className = 'history-delete';
      del.textContent = '🗑';
      del.setAttribute('aria-label', 'Eintrag löschen');
      del.addEventListener('click', () => {
        if (!confirm('Diesen Historien-Eintrag löschen?')) return;
        state.history.splice(hi, 1);
        saveState();
        renderHistory();
      });
      header.appendChild(date);
      header.appendChild(del);
      card.appendChild(header);

      const scores = document.createElement('div');
      scores.className = 'history-scores';
      const sorted = [...entry.players].sort((a, b) => b.total - a.total);
      const maxScore = sorted.length ? sorted[0].total : 0;
      sorted.forEach((p) => {
        const row = document.createElement('div');
        row.className = 'history-score-row' + (p.total === maxScore && maxScore > 0 ? ' winner' : '');
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = p.name;
        const score = document.createElement('span');
        score.textContent = p.total;
        row.appendChild(name);
        row.appendChild(score);
        scores.appendChild(row);
      });
      card.appendChild(scores);
      historyList.appendChild(card);
    });
  }

  document.getElementById('historyBtn').addEventListener('click', () => {
    renderHistory();
    historyOverlay.hidden = false;
  });

  document.getElementById('closeHistory').addEventListener('click', () => {
    historyOverlay.hidden = true;
  });

  historyOverlay.addEventListener('click', (e) => {
    if (e.target === historyOverlay) historyOverlay.hidden = true;
  });

  render();
</script>
</body>
</html>
